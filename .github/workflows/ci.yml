name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  server:
    name: Build server (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SampleApp.Server/SampleApp.Server.csproj

      - name: Build
        run: dotnet build SampleApp.Server/SampleApp.Server.csproj --no-restore -c Release

  client:
    name: Build client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sample_App.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Sample_App.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [ server, client ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sample-app:latest
            ghcr.io/${{ github.repository_owner }}/sample-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    # This is the only job on the self-hosted runner (a home server). Keep it gated to
    # direct pushes to main (not pull_request/pull_request_target) -- github.ref for a
    # pull_request event is refs/pull/N/merge, never refs/heads/main, so a PR (including
    # from a fork, now that this repo is public) can never satisfy this condition and
    # reach the runner. Do not add a self-hosted job that responds to pull_request.
    runs-on: [ self-hosted, sample-app ]
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull and restart
        run: |
          cd ~/sample-app
          docker compose pull sample-app
          docker compose up -d
          docker compose up -d --no-deps --force-recreate sample-app
          docker image prune -f
